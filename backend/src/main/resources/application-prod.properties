spring.config.activate.on-profile=prod
spring.datasource.url=jdbc:mysql://${SMARTMED_DB_HOST:${MYSQLHOST}}:${SMARTMED_DB_PORT:${MYSQLPORT:3306}}/${SMARTMED_DB_NAME:${MYSQLDATABASE}}?serverTimezone=UTC
spring.datasource.username=${SMARTMED_DB_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SMARTMED_DB_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.hikari.data-source-properties.sslMode=${SMARTMED_DB_SSL_MODE}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=true
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=${SMARTMED_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
smartmed.security.cors.allowed-origins=${SMARTMED_CORS_ORIGINS}
spring.flyway.clean-disabled=true
