spring.application.name=smartmed
server.port=${SMARTMED_SERVER_PORT:8080}

# Database (MySQL) — override via environment variables in production
spring.datasource.url=${SMARTMED_DB_URL:jdbc:mysql://localhost:3306/smartmed?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SMARTMED_DB_USERNAME:smartmed}
spring.datasource.password=${SMARTMED_DB_PASSWORD:smartmed}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SMARTMED_JPA_DDL:auto}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# CORS — comma-separated origins
smartmed.cors.allowed-origins=${SMARTMED_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# API
smartmed.api.version=v1

# Drug interaction provider (Phase 6) — never commit real API keys
smartmed.interaction.provider=${SMARTMED_INTERACTION_PROVIDER:mock}
smartmed.interaction.api-key=${SMARTMED_INTERACTION_API_KEY:}

# JWT (Phase 2)
smartmed.security.jwt.secret=${SMARTMED_JWT_SECRET:}
smartmed.security.jwt.expiration-ms=${SMARTMED_JWT_EXPIRATION_MS:86400000}
