spring.application.name=smartmed
server.port=${PORT:${SMARTMED_SERVER_PORT:8080}}

# Local defaults; production profile requires external Railway database values.
spring.datasource.url=${SMARTMED_DB_URL:jdbc:mysql://localhost:3306/smartmed?serverTimezone=UTC&sslMode=${SMARTMED_DB_SSL_MODE:DISABLED}}
spring.datasource.username=${SMARTMED_DB_USERNAME:${MYSQLUSER:smartmed}}
spring.datasource.password=${SMARTMED_DB_PASSWORD:${MYSQLPASSWORD:smartmed}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=${SMARTMED_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}

spring.jpa.hibernate.ddl-auto=${SMARTMED_JPA_DDL:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=${SMARTMED_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

smartmed.security.cors.allowed-origins=${SMARTMED_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
smartmed.security.jwt.secret=${SMARTMED_JWT_SECRET:}
smartmed.security.jwt.expiration-ms=${SMARTMED_JWT_EXPIRATION_MS:86400000}
smartmed.security.rate-limit.login-failures=${SMARTMED_LOGIN_FAILURE_LIMIT:10}
smartmed.security.rate-limit.registration-requests=${SMARTMED_REGISTRATION_LIMIT:8}
smartmed.security.rate-limit.window-seconds=${SMARTMED_AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
smartmed.security.rate-limit.max-tracked-keys=${SMARTMED_AUTH_RATE_LIMIT_MAX_KEYS:10000}
smartmed.timezone=${SMARTMED_TIMEZONE:Asia/Kolkata}

smartmed.api.version=v1
smartmed.interaction.provider=${SMARTMED_INTERACTION_PROVIDER:mock}
smartmed.interaction.api-key=${SMARTMED_INTERACTION_API_KEY:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
