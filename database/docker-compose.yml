services:
  mysql:
    image: mysql:8.0
    container_name: smartmed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartmed}
      MYSQL_USER: ${MYSQL_USER:-smartmed}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartmed}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - smartmed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartmed_mysql_data:
